<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全功能雙向網頁編輯器</title>
    <style>
        :root {
            --primary: #4a90e2;
            --border: #ddd;
        }
        body {
            font-family: -apple-system, "Microsoft JhengHei", sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #f8f9fa;
        }
        /* 工具列 */
        .toolbar {
            background: #fff;
            padding: 8px 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .group {
            display: flex;
            gap: 4px;
            align-items: center;
            border-right: 2px solid #eee;
            padding-right: 8px;
            margin-right: 4px;
        }
        .group:last-child { border-right: none; }
        
        select, button, input[type="color"] {
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #f0f0f0; border-color: #bbb; }
        button:active { background: #e0e0e0; }
        
        .label-text { font-size: 12px; color: #888; margin-right: 4px; font-weight: bold; }

        /* 內容區 */
        .main-content {
            display: flex;
            flex: 1;
            padding: 15px;
            gap: 15px;
            overflow: hidden;
        }
        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .panel-title {
            background: #f1f3f4;
            padding: 8px 15px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            border-bottom: 1px solid var(--border);
        }
        #visual-editor {
            flex: 1;
            padding: 25px;
            outline: none;
            overflow-y: auto;
            line-height: 1.6;
        }
        /* 內部標籤預設樣式 */
        #visual-editor table { border-collapse: collapse; width: 100%; }
        #visual-editor td { border: 1px solid #ccc; padding: 8px; }

        #html-output {
            flex: 1;
            padding: 15px;
            border: none;
            resize: none;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            background: #1e1e1e;
            color: #9cdcfe;
            outline: none;
        }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="group">
        <select onchange="execCmdWithArg('formatBlock', this.value); this.selectedIndex=0;">
            <option value="" selected disabled>標題層級</option>
            <option value="H1">標題 1</option>
            <option value="H2">標題 2</option>
            <option value="P">一般段落</option>
        </select>
        <select onchange="execCmdWithArg('fontSize', this.value); this.selectedIndex=0;">
            <option value="" selected disabled>字體大小</option>
            <option value="1">極小</option>
            <option value="3">標準</option>
            <option value="5">較大</option>
            <option value="7">特大</option>
        </select>
    </div>

    <div class="group">
        <button onclick="execCmd('bold')" title="粗體"><b>B</b></button>
        <button onclick="execCmd('italic')" title="斜體"><i>I</i></button>
        <input type="color" onchange="execCmdWithArg('foreColor', this.value)" title="顏色">
    </div>

    <div class="group">
        <span class="label-text">對齊</span>
        <button onclick="execCmd('justifyLeft')" title="靠左對齊">├</button>
        <button onclick="execCmd('justifyCenter')" title="置中對齊">┼</button>
        <button onclick="execCmd('justifyRight')" title="靠右對齊">┤</button>
    </div>

    <div class="group">
        <button onclick="insertLink()">🔗</button>
        <button onclick="insertImage()">🖼️</button>
        <button onclick="insertTable()">📊 表格</button>
    </div>

    <button onclick="execCmd('removeFormat')" style="color: #d9534f; border-color: #f5c6cb;">清除格式</button>
</div>

<div class="main-content">
    <div class="panel">
        <div class="panel-title">視覺編輯器</div>
        <div id="visual-editor" contenteditable="true">
            <h2 style="text-align: center;">歡迎使用雙向編輯器</h2>
            <p>選取這段文字後，點擊上方的<b>對齊按鈕</b>試看看！</p>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">HTML 原始碼</div>
        <textarea id="html-output"></textarea>
    </div>
</div>

<script>
    const visual = document.getElementById('visual-editor');
    const html = document.getElementById('html-output');

    function sync() { html.value = visual.innerHTML; }
    visual.addEventListener('input', sync);
    html.addEventListener('input', () => { visual.innerHTML = html.value; });

    function execCmd(cmd) {
        document.execCommand(cmd, false, null);
        sync();
        visual.focus();
    }

    function execCmdWithArg(cmd, arg) {
        document.execCommand(cmd, false, arg);
        sync();
        visual.focus();
    }

    function insertLink() {
        const url = prompt("請輸入連結:", "https://");
        if (url) execCmdWithArg('createLink', url);
    }

    function insertImage() {
        const url = prompt("圖片網址:", "https://");
        if (url) execCmdWithArg('insertImage', url);
    }

    function insertTable() {
        const r = prompt("列(Rows):", "2"), c = prompt("行(Cols):", "2");
        if (r && c) {
            let t = `<table style="width:100%; border:1px solid #ccc; border-collapse: collapse;">`;
            for(let i=0; i<r; i++) {
                t += '<tr>';
                for(let j=0; j<c; j++) t += '<td style="border:1px solid #ccc; padding:8px;">單元格</td>';
                t += '</tr>';
            }
            t += '</table><p></p>';
            document.execCommand('insertHTML', false, t);
            sync();
        }
    }

    // 初始化同步
    sync();
</script>

</body>
</html>
