<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上抽獎系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-10">

  <div id="app" class="max-w-6xl mx-auto px-4 py-6">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-slate-800 tracking-wide mb-2">🎉 線上抽獎系統</h1>
      <p class="text-slate-500">支援 Excel 匯入、名單去重、即時編輯與結果匯出</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 mb-3 border-b pb-2">1. 參加者名單 (共 {{ participants.length }} 人)</h2>
        
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">匯入 Excel (欄位: 姓名)</label>
            <input type="file" @change="importParticipants" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"/>
          </div>

          <div class="flex gap-2">
            <button @click="removeDuplicates" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white text-xs py-2 px-3 rounded font-medium transition">
              剔除重複名單
            </button>
            <button @click="clearParticipants" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs py-2 px-3 rounded font-medium transition">
              清空
            </button>
          </div>

          <div>
            <label class="block text-xs text-slate-500 mb-1">名單預覽/編輯 (一行一人)</label>
            <textarea v-model="rawParticipantsText" @blur="syncParticipantsFromText" class="w-full h-40 p-2 text-xs border rounded focus:ring-2 focus:ring-indigo-400 outline-none resize-none" placeholder="請輸入或匯入名單..."></textarea>
          </div>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 mb-3 border-b pb-2">2. 獎項設定</h2>
        
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">匯入 Excel (欄位: 獎項, 名額)</label>
            <input type="file" @change="importPrizes" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"/>
          </div>

          <div class="flex gap-2">
            <input v-model="newPrize.name" type="text" placeholder="獎項名稱" class="flex-2 w-2/3 text-xs p-2 border rounded outline-none focus:ring-1 focus:ring-indigo-400">
            <input v-model.number="newPrize.count" type="number" min="1" placeholder="名額" class="flex-1 w-1/3 text-xs p-2 border rounded outline-none focus:ring-1 focus:ring-indigo-400">
            <button @click="addPrize" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-2 rounded font-medium">新增</button>
          </div>

          <div class="h-40 overflow-y-auto border rounded p-2 space-y-2">
            <div v-for="(prize, index) in prizes" :key="index" class="flex items-center justify-between bg-slate-50 p-2 rounded text-xs border">
              <input v-model="prize.name" class="font-medium bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 outline-none w-1/2">
              <div class="flex items-center gap-1">
                <span>名額:</span>
                <input v-model.number="prize.count" type="number" min="1" class="w-12 border rounded text-center bg-white">
              </div>
              <button @click="removePrize(index)" class="text-rose-500 hover:text-rose-700 font-bold ml-1">✕</button>
            </div>
            <div v-if="prizes.length === 0" class="text-center text-slate-400 text-xs py-8">尚無設定獎項</div>
          </div>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
        <div>
          <h2 class="text-lg font-bold text-slate-700 mb-3 border-b pb-2">3. 抽獎控制</h2>
          
          <div class="space-y-4">
            <div>
              <label class="block text-xs text-slate-500 mb-1">選擇單項抽獎</label>
              <select v-model="selectedPrizeIndex" class="w-full p-2 text-sm border rounded bg-white outline-none focus:ring-2 focus:ring-indigo-400">
                <option :value="null">--請選擇獎項--</option>
                <option v-for="(prize, idx) in prizes" :key="idx" :value="idx">
                  {{ prize.name }} (名額 {{ prize.count }} 人)
                </option>
              </select>
            </div>

            <div class="pt-2 space-y-2">
              <button @click="drawSinglePrize" :disabled="selectedPrizeIndex === null || isDrawing" class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-2.5 rounded-lg transition shadow">
                抽取選定獎項 (一次全抽)
              </button>
              
              <button @click="drawAllPrizes" :disabled="prizes.length === 0 || isDrawing" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-bold py-2.5 rounded-lg transition shadow">
                一次抽取「所有獎項」
              </button>
            </div>
          </div>
        </div>

        <div class="pt-4 border-t mt-4">
          <button @click="resetAll" class="w-full bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 border border-slate-200 hover:border-rose-200 text-xs py-2 rounded font-medium transition">
            重置所有數據
          </button>
        </div>
      </div>

    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          🏆 中獎名單
          <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-normal">
            共 {{ totalWinnersCount }} 人中獎
          </span>
        </h2>
        <button @click="exportResults" :disabled="winners.length === 0" class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white text-xs font-semibold px-4 py-2 rounded-lg transition flex items-center gap-1">
          下載中獎結果 Excel
        </button>
      </div>

      <div v-if="winners.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div v-for="(item, index) in winners" :key="index" class="bg-slate-50 border border-slate-200 rounded-lg p-4">
          <div class="font-bold text-indigo-600 text-base border-b border-slate-200 pb-1 mb-2 flex justify-between">
            <span>{{ item.prizeName }}</span>
            <span class="text-xs text-slate-400 font-normal">共 {{ item.names.length }} 人</span>
          </div>
          <div class="flex flex-wrap gap-1.5">
            <span v-for="name in item.names" :key="name" class="bg-white border text-slate-700 text-xs font-medium px-2.5 py-1 rounded shadow-sm">
              {{ name }}
            </span>
          </div>
        </div>
      </div>

      <div v-else class="text-center text-slate-400 py-12">
        尚未開始抽獎或無中獎名單
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, computed, watch } = Vue;

    createApp({
      setup() {
        const participants = ref([]);
        const rawParticipantsText = ref('');
        const prizes = ref([
          { name: '頭獎', count: 1 },
          { name: '二獎', count: 2 },
          { name: '三獎', count: 5 }
        ]);
        const newPrize = ref({ name: '', count: 1 });
        const selectedPrizeIndex = ref(null);
        const winners = ref([]); // 格式: [{ prizeName: '頭獎', names: ['張三', '李四'] }]
        const isDrawing = ref(false);

        // 同步文字框內容至陣列
        const syncParticipantsFromText = () => {
          participants.value = rawParticipantsText.value
            .split('\n')
            .map(s => s.trim())
            .filter(s => s.length > 0);
        };

        // 觀察陣列變動同步更新文字框
        watch(participants, (newVal) => {
          rawParticipantsText.value = newVal.join('\n');
        }, { deep: true });

        // 匯入參加者 Excel
        const importParticipants = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
            
            const list = jsonData.map(row => row['姓名'] || row['Name'] || Object.values(row)[0]).filter(Boolean);
            participants.value = [...participants.value, ...list];
            e.target.value = '';
          };
          reader.readAsArrayBuffer(file);
        };

        // 剔除重複
        const removeDuplicates = () => {
          participants.value = [...new Set(participants.value)];
        };

        // 清空參加者
        const clearParticipants = () => {
          participants.value = [];
        };

        // 匯入獎項 Excel
        const importPrizes = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
            
            const imported = jsonData.map(row => ({
              name: row['獎項'] || row['Prize'] || '未命名獎項',
              count: parseInt(row['名額'] || row['Count'] || 1, 10)
            }));
            prizes.value = imported;
            e.target.value = '';
          };
          reader.readAsArrayBuffer(file);
        };

        const addPrize = () => {
          if (!newPrize.value.name.trim()) return;
          prizes.value.push({ ...newPrize.value });
          newPrize.value.name = '';
          newPrize.value.count = 1;
        };

        const removePrize = (index) => {
          prizes.value.splice(index, 1);
          if (selectedPrizeIndex.value === index) selectedPrizeIndex.value = null;
        };

        // 觸發彩帶動畫
        const fireConfetti = () => {
          confetti({
            particleCount: 120,
            spread: 70,
            origin: { y: 0.6 }
          });
        };

        // 抽獎核心邏輯
        const executeDraw = (prize) => {
          if (participants.value.length === 0) return [];
          const countToDraw = Math.min(prize.count, participants.value.length);
          const drawnNames = [];

          for (let i = 0; i < countToDraw; i++) {
            const randomIndex = Math.floor(Math.random() * participants.value.length);
            drawnNames.push(participants.value[randomIndex]);
            participants.value.splice(randomIndex, 1);
          }
          return drawnNames;
        };

        // 抽單一獎項
        const drawSinglePrize = () => {
          if (selectedPrizeIndex.value === null) return;
          const prize = prizes.value[selectedPrizeIndex.value];
          
          if (participants.value.length === 0) {
            alert('參加者名單已空！');
            return;
          }

          isDrawing.value = true;
          const drawnNames = executeDraw(prize);

          // 記錄或合併結果
          const existing = winners.value.find(w => w.prizeName === prize.name);
          if (existing) {
            existing.names.push(...drawnNames);
          } else {
            winners.value.push({ prizeName: prize.name, names: drawnNames });
          }

          fireConfetti();
          isDrawing.value = false;
        };

        // 一次抽取所有獎項
        const drawAllPrizes = () => {
          if (participants.value.length === 0) {
            alert('參加者名單已空！');
            return;
          }

          isDrawing.value = true;
          prizes.value.forEach(prize => {
            if (participants.value.length > 0) {
              const drawnNames = executeDraw(prize);
              const existing = winners.value.find(w => w.prizeName === prize.name);
              if (existing) {
                existing.names.push(...drawnNames);
              } else {
                winners.value.push({ prizeName: prize.name, names: drawnNames });
              }
            }
          });

          fireConfetti();
          isDrawing.value = false;
        };

        // 重置
        const resetAll = () => {
          if (confirm('確定要重置所有資料與中獎結果嗎？')) {
            participants.value = [];
            winners.value = [];
            selectedPrizeIndex.value = null;
          }
        };

        // 下載結果 Excel
        const exportResults = () => {
          const exportData = [];
          winners.value.forEach(w => {
            w.names.forEach(name => {
              exportData.push({ '獎項': w.prizeName, '中獎者': name });
            });
          });

          const worksheet = XLSX.utils.json_to_sheet(exportData);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, '中獎名單');
          XLSX.writeFile(workbook, '抽獎結果.xlsx');
        };

        const totalWinnersCount = computed(() => {
          return winners.value.reduce((sum, item) => sum + item.names.length, 0);
        });

        return {
          participants,
          rawParticipantsText,
          syncParticipantsFromText,
          importParticipants,
          removeDuplicates,
          clearParticipants,
          prizes,
          newPrize,
          importPrizes,
          addPrize,
          removePrize,
          selectedPrizeIndex,
          drawSinglePrize,
          drawAllPrizes,
          winners,
          resetAll,
          exportResults,
          totalWinnersCount,
          isDrawing
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
