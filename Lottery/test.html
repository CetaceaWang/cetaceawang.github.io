<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業雲端抽獎系統</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #ff4757;
            --secondary-color: #2f3542;
            --accent-color: #ffa502;
            --bg-color: #f1f2f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; color: var(--primary-color); }

        .setup-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
        }

        label { font-weight: bold; display: block; margin-bottom: 10px; }
        textarea {
            width: 100%;
            height: 150px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:active { transform: scale(0.95); }

        .btn-import { background-color: var(--accent-color); color: white; }
        .btn-draw { background-color: var(--primary-color); color: white; font-size: 1.2em; }
        .btn-reset { background-color: var(--secondary-color); color: white; }
        .btn-download { background-color: #2ed573; color: white; }

        .lottery-panel {
            text-align: center;
            background: var(--secondary-color);
            color: white;
            padding: 40px;
            border-radius: 15px;
            margin-top: 20px;
        }

        #current-prize { color: var(--accent-color); font-size: 1.5em; }
        #winner-display { font-size: 3em; margin: 20px 0; min-height: 80px; }

        .result-table {
            width: 100%;
            margin-top: 30px;
            border-collapse: collapse;
        }

        .result-table th, .result-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .result-table th { background-color: #f8f9fa; }

        .status-msg { color: #666; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎊 專業抽獎系統 🎊</h1>

    <div class="setup-section">
        <div class="card">
            <label>1. 參加者名單 (每行一個名字)</label>
            <input type="file" id="upload-members" accept=".xlsx, .xls" style="margin-bottom: 10px;">
            <textarea id="member-list" placeholder="請匯入或手動輸入名單..."></textarea>
            <div id="member-count" class="status-msg">目前名單人數：0</div>
            <button class="btn-import" onclick="removeDuplicates()" style="margin-top:5px; padding: 5px 10px;">移除重複</button>
        </div>

        <div class="card">
            <label>2. 獎項設定 (格式：獎名,名額)</label>
            <input type="file" id="upload-prizes" accept=".xlsx, .xls" style="margin-bottom: 10px;">
            <textarea id="prize-list" placeholder="例如：
頭獎,1
貳獎,3
普獎,10"></textarea>
            <div class="status-msg">注意：請依抽獎順序排列（通常先抽小獎，最後抽大獎）</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-draw" onclick="startDraw()">開始抽獎</button>
        <button class="btn-reset" onclick="resetSystem()">系統重置</button>
        <button class="btn-download" onclick="downloadResults()">下載中獎名單</button>
    </div>

    <div class="lottery-panel">
        <div id="current-prize">準備抽獎...</div>
        <div id="winner-display">???</div>
    </div>

    <table class="result-table" id="result-table">
        <thead>
            <tr>
                <th>序號</th>
                <th>獎項</th>
                <th>中獎者姓名</th>
            </tr>
        </thead>
        <tbody id="result-body">
            </tbody>
    </table>
</div>

<script>
    let winnersData = []; // 儲存中獎結果

    // --- Excel 匯入功能 ---
    function handleFile(elementId, textareaId) {
        document.getElementById(elementId).addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
                
                // 將二維陣列轉為文字格式填入 Textarea
                const text = rows.map(row => row.join(',')).filter(row => row.trim() !== '').join('\n');
                document.getElementById(textareaId).value = text;
                updateCount();
            };
            reader.readAsArrayBuffer(file);
        });
    }

    handleFile('upload-members', 'member-list');
    handleFile('upload-prizes', 'prize-list');

    // --- 名單處理 ---
    function getMembers() {
        return document.getElementById('member-list').value
            .split('\n')
            .map(n => n.trim())
            .filter(n => n !== '');
    }

    function removeDuplicates() {
        const list = getMembers();
        const unique = [...new Set(list)];
        document.getElementById('member-list').value = unique.join('\n');
        updateCount();
        alert('已移除重複名單');
    }

    function updateCount() {
        const count = getMembers().length;
        document.getElementById('member-count').innerText = `目前名單人數：${count}`;
    }

    document.getElementById('member-list').addEventListener('input', updateCount);

    // --- 抽獎邏輯 ---
    function startDraw() {
        let members = getMembers();
        let prizeRaw = document.getElementById('prize-list').value.split('\n').filter(p => p.trim() !== '');

        if (members.length === 0) return alert('請先匯入名單！');
        if (prizeRaw.length === 0) return alert('請設定獎項！');

        // 取得第一個獎項 (先進先出)
        let currentPrizeLine = prizeRaw[0].split(',');
        let prizeName = currentPrizeLine[0];
        let prizeQty = parseInt(currentPrizeLine[1]) || 1;

        if (members.length < prizeQty) return alert('剩餘人數不足以抽取該獎項名額！');

        // 更新介面
        document.getElementById('current-prize').innerText = `正在抽取：${prizeName} (共 ${prizeQty} 名)`;
        const display = document.getElementById('winner-display');
        
        // 滾動特效 (簡單模擬)
        let duration = 1500;
        let startTime = Date.now();
        
        let timer = setInterval(() => {
            display.innerText = members[Math.floor(Math.random() * members.length)];
            if (Date.now() - startTime > duration) {
                clearInterval(timer);
                executeDraw(prizeName, prizeQty);
            }
        }, 50);
    }

    function executeDraw(prizeName, qty) {
        let members = getMembers();
        let winners = [];

        // 隨機選取
        for (let i = 0; i < qty; i++) {
            let randomIndex = Math.floor(Math.random() * members.length);
            winners.push(members.splice(randomIndex, 1)[0]);
        }

        // 更新剩餘名單
        document.getElementById('member-list').value = members.join('\n');
        updateCount();

        // 更新獎項名單 (移除已抽完的獎項)
        let prizeLines = document.getElementById('prize-list').value.split('\n');
        prizeLines.shift();
        document.getElementById('prize-list').value = prizeLines.join('\n');

        // 顯示結果
        document.getElementById('winner-display').innerText = winners.join(', ');
        
        // 觸發噴花特效
        triggerConfetti();

        // 加入紀錄表格
        winners.forEach(w => {
            winnersData.push({ prize: prizeName, name: w });
            renderTable();
        });
    }

    function triggerConfetti() {
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 }
        });
    }

    function renderTable() {
        const tbody = document.getElementById('result-body');
        tbody.innerHTML = '';
        winnersData.forEach((item, index) => {
            let row = `<tr><td>${index + 1}</td><td>${item.prize}</td><td>${item.name}</td></tr>`;
            tbody.innerHTML += row;
        });
    }

    // --- 重置與下載 ---
    function resetSystem() {
        if (confirm('確定要清空所有資料與紀錄嗎？')) {
            document.getElementById('member-list').value = '';
            document.getElementById('prize-list').value = '';
            document.getElementById('winner-display').innerText = '???';
            document.getElementById('current-prize').innerText = '準備抽獎...';
            winnersData = [];
            renderTable();
            updateCount();
        }
    }

    function downloadResults() {
        if (winnersData.length === 0) return alert('尚無中獎紀錄可下載');
        
        let csvContent = "data:text/csv;charset=utf-8,序號,獎項,中獎者\n";
        winnersData.forEach((w, i) => {
            csvContent += `${i + 1},${w.prize},${w.name}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "中獎名單.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
