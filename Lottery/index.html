<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業抽獎系統 2.5 - 整合版</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; }
        .winner-anim { animation: celebrate 0.6s ease-in-out; }
        @keyframes celebrate { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .bg-glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        
        <div class="flex flex-col lg:flex-row justify-between items-start mb-8 gap-6">
            <div>
                <h1 class="text-4xl font-black text-indigo-800 tracking-tight">🏆 專業抽獎系統 <span class="text-sm font-normal bg-indigo-100 text-indigo-600 px-2 py-1 rounded">v2.5 Full</span></h1>
                <p class="text-slate-500 mt-2">支援 Excel 匯入、名單去重、即時編輯功能</p>
            </div>
            
            <details class="bg-amber-50 border border-amber-200 rounded-xl p-4 w-full lg:max-w-md shadow-sm">
                <summary class="cursor-pointer text-amber-800 font-bold text-sm select-none flex items-center">
                    💡 使用小技巧 (操作前請讀我)
                </summary>
                <ul class="text-xs text-amber-900 mt-3 space-y-2 list-disc list-inside">
                    <li><b>匯入：</b>Excel 第一列請包含「姓名」或「獎項名稱」。</li>
                    <li><b>去重：</b>點擊紅色「移除重複」按鈕，系統會自動清理空白與重複名。</li>
                    <li><b>生效：</b>任何編輯後，請務必點擊「🔄 重置系統」確保數據同步。</li>
                    <li><b>中獎：</b>同一個人不會重複中獎，系統會自動從池中移除。</li>
                </ul>
            </details>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">👥 參加者名單</h2>
                    <div class="flex gap-2">
                        <button onclick="document.getElementById('memberFile').click()" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-2 rounded-lg font-bold transition">匯入 Excel</button>
                        <button onclick="removeDuplicates()" class="text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-2 rounded-lg font-bold transition">移除重複</button>
                        <input type="file" id="memberFile" accept=".xlsx, .xls, .csv" class="hidden">
                    </div>
                </div>
                <textarea id="memberTextarea" placeholder="請輸入姓名（每行一個名字）" 
                    class="w-full h-56 p-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none text-sm leading-relaxed transition shadow-inner bg-slate-50"></textarea>
                <div class="flex justify-between mt-3 px-1">
                    <span id="dupNotice" class="text-xs text-rose-500 font-bold"></span>
                    <div id="memberCount" class="text-sm text-slate-600 font-black">目前人數：0</div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">🎁 獎項設定</h2>
                    <button onclick="document.getElementById('prizeFile').click()" class="text-xs bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-3 py-2 rounded-lg font-bold transition">匯入獎項</button>
                    <input type="file" id="prizeFile" accept=".xlsx, .xls, .csv" class="hidden">
                </div>
                <div class="grid grid-cols-12 gap-2 mb-2 text-xs font-bold text-slate-400 px-2 uppercase tracking-widest">
                    <div class="col-span-8">獎項名稱</div>
                    <div class="col-span-4 text-center">數量</div>
                </div>
                <div id="prizeList" class="space-y-3 overflow-y-auto pr-2 no-scrollbar flex-grow" style="max-height: 220px;">
                    <div class="grid grid-cols-12 gap-2">
                        <input type="text" class="p-name col-span-8 p-2 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="獎項名稱">
                        <input type="number" class="p-count col-span-4 p-2 rounded-lg border border-slate-200 text-sm text-center font-bold" value="1">
                    </div>
                </div>
                <button onclick="addPrizeRow()" class="w-full mt-4 py-2 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition font-medium text-sm">+ 新增獎項欄位</button>
            </div>
        </div>

        <div class="bg-indigo-900 rounded-3xl p-10 text-center shadow-2xl mb-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                <div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-white rounded-full blur-3xl"></div>
                <div class="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-indigo-400 rounded-full blur-3xl"></div>
            </div>

            <div class="relative z-10">
                <div class="mb-6 inline-flex flex-col items-center">
                    <span class="text-indigo-300 text-xs font-bold tracking-widest uppercase mb-2">Select Prize</span>
                    <select id="prizeSelect" class="bg-indigo-800 text-white text-xl md:text-2xl font-black px-6 py-3 rounded-2xl border border-indigo-700 outline-none cursor-pointer hover:bg-indigo-700 transition shadow-lg"></select>
                </div>
                
                <div id="result" class="h-40 flex items-center justify-center text-5xl md:text-7xl font-black text-yellow-400 mb-8 drop-shadow-[0_10px_20px_rgba(0,0,0,0.3)]">
                    READY?
                </div>

                <div class="flex flex-col sm:flex-row justify-center gap-4">
                    <button onclick="draw()" class="bg-yellow-400 hover:bg-yellow-300 text-indigo-950 px-16 py-5 rounded-2xl text-3xl font-black shadow-[0_8px_0_rgb(202,138,4)] transition-all active:translate-y-1 active:shadow-none">
                        🎰 開始抽獎
                    </button>
                    <button onclick="resetSystem()" class="bg-indigo-700 hover:bg-indigo-600 text-indigo-100 px-8 py-5 rounded-2xl text-lg font-bold transition">
                        🔄 重置系統
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800">📜 中獎紀錄</h3>
                <button onclick="exportHistory()" class="text-sm font-bold text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg transition">匯出紀錄 (.txt)</button>
            </div>
            <ul id="history" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 h-64 overflow-y-auto p-2 no-scrollbar">
                </ul>
            <div id="emptyHistory" class="text-center py-10 text-slate-400 italic">尚未有中獎資料</div>
        </div>

    </div>

    <script>
        let currentMembers = []; 
        let currentPrizes = [];
        let history = [];

        // 1. 名單去重功能
        function removeDuplicates() {
            const textarea = document.getElementById('memberTextarea');
            const rawList = textarea.value.split('\n');
            const cleanList = rawList.map(name => name.trim()).filter(name => name !== '');
            const uniqueList = [...new Set(cleanList)];
            const removedCount = cleanList.length - uniqueList.length;

            if (removedCount > 0) {
                textarea.value = uniqueList.join('\n');
                updateMemberCount();
                const notice = document.getElementById('dupNotice');
                notice.innerText = `✨ 已自動移除 ${removedCount} 筆重複名單`;
                setTimeout(() => { notice.innerText = ''; }, 4000);
            } else {
                alert("檢查完畢，名單中沒有重複項。");
            }
        }

        // 2. 檔案處理邏輯
        function handleFile(e, callback) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const workbook = XLSX.read(evt.target.result, { type: 'binary' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                callback(XLSX.utils.sheet_to_json(sheet));
                e.target.value = ''; // 清空 input 以便下次觸發
            };
            reader.readAsBinaryString(file);
        }

        document.getElementById('memberFile').addEventListener('change', (e) => {
            handleFile(e, (data) => {
                const names = data.map(row => row['姓名'] || row['Name'] || Object.values(row)[0]);
                document.getElementById('memberTextarea').value = names.join('\n');
                updateMemberCount();
            });
        });

        document.getElementById('prizeFile').addEventListener('change', (e) => {
            handleFile(e, (data) => {
                const list = document.getElementById('prizeList');
                list.innerHTML = '';
                data.forEach(row => {
                    const name = row['獎項名稱'] || row['Item'] || Object.values(row)[0];
                    const count = row['數量'] || row['Count'] || Object.values(row)[1];
                    addPrizeRow(name, count);
                });
                syncPrizes();
            });
        });

        // 3. 獎項 UI 操作
        function addPrizeRow(name = '', count = 1) {
            const div = document.createElement('div');
            div.className = 'grid grid-cols-12 gap-2';
            div.innerHTML = `
                <input type="text" class="p-name col-span-8 p-2 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 outline-none shadow-sm" value="${name}" placeholder="獎項名稱">
                <input type="number" class="p-count col-span-4 p-2 rounded-lg border border-slate-200 text-sm text-center font-bold shadow-sm" value="${count}">
            `;
            document.getElementById('prizeList').appendChild(div);
        }

        function updateMemberCount() {
            const text = document.getElementById('memberTextarea').value;
            const count = text.split('\n').filter(n => n.trim() !== '').length;
            document.getElementById('memberCount').innerText = `目前人數：${count}`;
        }

        document.getElementById('memberTextarea').addEventListener('input', updateMemberCount);

        function syncPrizes() {
            const names = document.querySelectorAll('.p-name');
            const counts = document.querySelectorAll('.p-count');
            currentPrizes = [];
            names.forEach((el, i) => {
                const c = parseInt(counts[i].value);
                if (el.value.trim() !== '' && !isNaN(c)) {
                    currentPrizes.push({ name: el.value, count: c });
                }
            });
            updatePrizeSelect();
        }

        function updatePrizeSelect() {
            const select = document.getElementById('prizeSelect');
            if (currentPrizes.length === 0) {
                select.innerHTML = '<option>尚未設定獎項</option>';
                return;
            }
            select.innerHTML = currentPrizes.map((p, i) => 
                `<option value="${i}">${p.name} (剩 ${p.count} 名)</option>`
            ).join('');
        }

        // 4. 重置與抽獎核心
        function resetSystem() {
            if (!confirm("確定重置？這將會清除當前紀錄，並依照左側名單與右側獎項重新開始。")) return;
            currentMembers = document.getElementById('memberTextarea').value.split('\n').filter(n => n.trim() !== '').map(n => n.trim());
            syncPrizes();
            history = [];
            document.getElementById('history').innerHTML = '';
            document.getElementById('emptyHistory').style.display = 'block';
            document.getElementById('result').innerText = 'READY?';
            alert("系統重置成功，已準備就緒！");
        }

        function draw() {
            // 自動初始化檢查
            if (history.length === 0 && currentMembers.length === 0) {
                currentMembers = document.getElementById('memberTextarea').value.split('\n').filter(n => n.trim() !== '').map(n => n.trim());
                syncPrizes();
            }

            if (currentMembers.length === 0) return alert("名單已空！請增加名單後點擊重置。");
            if (currentPrizes.length === 0) return alert("請先設定獎項與數量。");

            const prizeIdx = document.getElementById('prizeSelect').value;
            const prize = currentPrizes[prizeIdx];

            if (!prize || prize.count <= 0) return alert("該獎項已全部抽完！");

            // 隨機抽取
            const winIdx = Math.floor(Math.random() * currentMembers.length);
            const winner = currentMembers.splice(winIdx, 1)[0];
            prize.count--;

            // UI 呈現
            const resDiv = document.getElementById('result');
            resDiv.innerText = winner;
            resDiv.classList.remove('winner-anim');
            void resDiv.offsetWidth; 
            resDiv.classList.add('winner-anim');

            // 紀錄
            document.getElementById('emptyHistory').style.display = 'none';
            const hList = document.getElementById('history');
            const log = `[${prize.name}] ${winner}`;
            history.push(log);
            
            const li = document.createElement('li');
            li.className = "bg-slate-50 border border-slate-200 p-3 rounded-xl flex justify-between items-center shadow-sm animate-fade-in";
            li.innerHTML = `<span class="font-bold text-slate-700">${log}</span><span class="text-[10px] bg-slate-200 px-2 py-1 rounded text-slate-500">#${history.length}</span>`;
            hList.prepend(li);

            updatePrizeSelect();
            updateMemberCount();
        }

        function exportHistory() {
            if (history.length === 0) return alert("尚無中獎紀錄可匯出");
            const content = "抽獎活動紀錄\n時間: " + new Date().toLocaleString() + "\n------------------\n" + history.join('\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `中獎名單_${new Date().getTime()}.txt`;
            a.click();
        }

        // 初始化人數顯示
        updateMemberCount();
    </script>
</body>
</html>
