<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業抽獎系統 v3.0 - 慶典特效版</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; }
        .winner-anim { animation: celebrate 0.6s ease-in-out; }
        @keyframes celebrate { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        
        <div class="flex flex-col lg:flex-row justify-between items-start mb-8 gap-6">
            <div>
                <h1 class="text-4xl font-black text-indigo-800 tracking-tight">🏆 專業抽獎系統 <span class="text-sm font-normal bg-indigo-100 text-indigo-600 px-2 py-1 rounded">v3.0 FX</span></h1>
                <p class="text-slate-500 mt-2">內建彩帶特效、名單去重與 Excel 支援</p>
            </div>
            
            <details class="bg-amber-50 border border-amber-200 rounded-xl p-4 w-full lg:max-w-md shadow-sm">
                <summary class="cursor-pointer text-amber-800 font-bold text-sm select-none">💡 操作技巧 (點擊展開)</summary>
                <ul class="text-xs text-amber-900 mt-3 space-y-2 list-disc list-inside">
                    <li><b>編輯後請重置：</b>修改名單或獎項後，務必點擊「🔄 重置系統」。</li>
                    <li><b>重複名單：</b>點擊「移除重複」可自動清理多餘的相同姓名。</li>
                    <li><b>中獎特效：</b>開獎瞬間會自動噴發彩帶！</li>
                </ul>
            </details>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800">👥 參加者名單</h2>
                    <div class="flex gap-2">
                        <button onclick="document.getElementById('memberFile').click()" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-2 rounded-lg font-bold">匯入 Excel</button>
                        <button onclick="removeDuplicates()" class="text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-2 rounded-lg font-bold">移除重複</button>
                        <input type="file" id="memberFile" accept=".xlsx, .xls, .csv" class="hidden">
                    </div>
                </div>
                <textarea id="memberTextarea" placeholder="請輸入姓名（每行一個）" 
                    class="w-full h-56 p-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none text-sm leading-relaxed bg-slate-50 shadow-inner"></textarea>
                <div class="flex justify-between mt-3">
                    <span id="dupNotice" class="text-xs text-rose-500 font-bold"></span>
                    <div id="memberCount" class="text-sm text-slate-600 font-black">人數：0</div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800">🎁 獎項設定</h2>
                    <button onclick="document.getElementById('prizeFile').click()" class="text-xs bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-3 py-2 rounded-lg font-bold">匯入獎項</button>
                    <input type="file" id="prizeFile" accept=".xlsx, .xls, .csv" class="hidden">
                </div>
                <div id="prizeList" class="space-y-3 overflow-y-auto pr-2 no-scrollbar" style="max-height: 250px;">
                    <div class="grid grid-cols-12 gap-2">
                        <input type="text" class="p-name col-span-8 p-2 rounded-lg border border-slate-200 text-sm" placeholder="獎項名稱">
                        <input type="number" class="p-count col-span-4 p-2 rounded-lg border border-slate-200 text-sm text-center font-bold" value="1">
                    </div>
                </div>
                <button onclick="addPrizeRow()" class="w-full mt-4 py-2 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl text-slate-500 text-sm font-medium hover:bg-slate-100">+ 新增獎項欄位</button>
            </div>
        </div>

        <div class="bg-indigo-950 rounded-3xl p-10 text-center shadow-2xl mb-8 relative">
            <div class="mb-6">
                <select id="prizeSelect" class="bg-indigo-800 text-white text-xl font-black px-6 py-3 rounded-2xl border border-indigo-700 outline-none cursor-pointer"></select>
            </div>
            
            <div id="result" class="h-40 flex items-center justify-center text-6xl md:text-8xl font-black text-yellow-400 mb-8 tracking-tighter drop-shadow-lg">
                READY
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button onclick="draw()" class="bg-yellow-400 hover:bg-yellow-300 text-indigo-950 px-16 py-5 rounded-2xl text-3xl font-black shadow-[0_8px_0_rgb(202,138,4)] active:translate-y-1 active:shadow-none transition-all">
                    🎰 開始抽獎
                </button>
                <button onclick="resetSystem()" class="bg-indigo-700 hover:bg-indigo-600 text-white px-8 py-5 rounded-2xl text-lg font-bold">
                    🔄 重置系統
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-slate-800">📜 中獎紀錄</h3>
                <button onclick="exportHistory()" class="text-sm font-bold text-indigo-600 hover:underline">匯出 (.txt)</button>
            </div>
            <ul id="history" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 h-64 overflow-y-auto no-scrollbar"></ul>
        </div>
    </div>

    <script>
        let currentMembers = []; 
        let currentPrizes = [];
        let history = [];

        // --- 特效函式：多重彩帶噴發 ---
        function fireConfetti() {
            const count = 200;
            const defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti({
                    ...defaults,
                    ...opts,
                    particleCount: Math.floor(count * particleRatio)
                });
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        // --- 名單與檔案處理 ---
        function removeDuplicates() {
            const textarea = document.getElementById('memberTextarea');
            const cleanList = textarea.value.split('\n').map(n => n.trim()).filter(n => n !== '');
            const uniqueList = [...new Set(cleanList)];
            const diff = cleanList.length - uniqueList.length;
            textarea.value = uniqueList.join('\n');
            updateMemberCount();
            if(diff > 0) {
                const notice = document.getElementById('dupNotice');
                notice.innerText = `✨ 已移除 ${diff} 筆重複名單`;
                setTimeout(() => notice.innerText = '', 3000);
            }
        }

        function handleFile(e, callback) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const workbook = XLSX.read(evt.target.result, { type: 'binary' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                callback(XLSX.utils.sheet_to_json(sheet));
                e.target.value = '';
            };
            reader.readAsBinaryString(file);
        }

        document.getElementById('memberFile').addEventListener('change', (e) => {
            handleFile(e, (data) => {
                const names = data.map(row => row['姓名'] || row['Name'] || Object.values(row)[0]);
                document.getElementById('memberTextarea').value = names.join('\n');
                updateMemberCount();
            });
        });

        document.getElementById('prizeFile').addEventListener('change', (e) => {
            handleFile(e, (data) => {
                const list = document.getElementById('prizeList');
                list.innerHTML = '';
                data.forEach(row => {
                    addPrizeRow(row['獎項名稱'] || Object.values(row)[0], row['數量'] || Object.values(row)[1]);
                });
                syncPrizes();
            });
        });

        function addPrizeRow(name = '', count = 1) {
            const div = document.createElement('div');
            div.className = 'grid grid-cols-12 gap-2';
            div.innerHTML = `<input type="text" class="p-name col-span-8 p-2 rounded-lg border text-sm" value="${name}" placeholder="獎項名稱"><input type="number" class="p-count col-span-4 p-2 rounded-lg border text-sm text-center font-bold" value="${count}">`;
            document.getElementById('prizeList').appendChild(div);
        }

        function updateMemberCount() {
            const text = document.getElementById('memberTextarea').value;
            const count = text.split('\n').filter(n => n.trim() !== '').length;
            document.getElementById('memberCount').innerText = `人數：${count}`;
        }

        function syncPrizes() {
            const names = document.querySelectorAll('.p-name');
            const counts = document.querySelectorAll('.p-count');
            currentPrizes = [];
            names.forEach((el, i) => {
                const c = parseInt(counts[i].value);
                if (el.value.trim() !== '' && !isNaN(c)) currentPrizes.push({ name: el.value, count: c });
            });
            updatePrizeSelect();
        }

        function updatePrizeSelect() {
            const select = document.getElementById('prizeSelect');
            select.innerHTML = currentPrizes.map((p, i) => `<option value="${i}">${p.name} (剩 ${p.count})</option>`).join('');
        }

        function resetSystem() {
            if (!confirm("確定重置？這將同步名單並清空紀錄。")) return;
            currentMembers = document.getElementById('memberTextarea').value.split('\n').filter(n => n.trim() !== '').map(n => n.trim());
            syncPrizes();
            history = [];
            document.getElementById('history').innerHTML = '';
            document.getElementById('result').innerText = 'READY';
        }

        function draw() {
            if (history.length === 0 && currentMembers.length === 0) {
                currentMembers = document.getElementById('memberTextarea').value.split('\n').filter(n => n.trim() !== '').map(n => n.trim());
                syncPrizes();
            }
            if (currentMembers.length === 0) return alert("名單已空！");
            const prizeIdx = document.getElementById('prizeSelect').value;
            const prize = currentPrizes[prizeIdx];
            if (!prize || prize.count <= 0) return alert("獎項已抽完！");

            const winIdx = Math.floor(Math.random() * currentMembers.length);
            const winner = currentMembers.splice(winIdx, 1)[0];
            prize.count--;

            // 更新結果與動畫
            const resDiv = document.getElementById('result');
            resDiv.innerText = winner;
            resDiv.classList.remove('winner-anim');
            void resDiv.offsetWidth; 
            resDiv.classList.add('winner-anim');

            // 觸發彩帶特效
            fireConfetti();

            // 紀錄
            const hList = document.getElementById('history');
            const log = `[${prize.name}] ${winner}`;
            history.push(log);
            const li = document.createElement('li');
            li.className = "bg-slate-50 border p-3 rounded-xl flex justify-between items-center text-sm shadow-sm";
            li.innerHTML = `<strong>${log}</strong><span class="text-xs text-slate-400">#${history.length}</span>`;
            hList.prepend(li);

            updatePrizeSelect();
            updateMemberCount();
        }

        function exportHistory() {
            if (history.length === 0) return alert("尚無紀錄");
            const blob = new Blob([history.join('\n')], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `中獎名單.txt`;
            a.click();
        }

        document.getElementById('memberTextarea').addEventListener('input', updateMemberCount);
        updateMemberCount();
    </script>
</body>
</html>
