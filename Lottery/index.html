<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幸運大抽獎</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--primary:#6c5ce7;--secondary:#a29bfe;--bg:#f5f7fb;--card:#fff;--text:#202633;--muted:#6b7280;--danger:#e74c3c;--success:#00b894}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:linear-gradient(135deg,#f5f7fb,#ece9ff);color:var(--text)}
header{padding:28px 20px;text-align:center;background:linear-gradient(135deg,#5f4bd8,#8e7dff);color:#fff;box-shadow:0 4px 18px #0002}
header h1{margin:0 0 8px;font-size:34px}header p{margin:0;opacity:.9}
.container{max-width:1250px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 8px 30px #30306014;margin-bottom:18px}
.card h2{margin:0 0 15px;font-size:20px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
button,.file-label{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;transition:.15s;display:inline-flex;align-items:center;justify-content:center}
button:hover,.file-label:hover{transform:translateY(-1px);filter:brightness(1.05)}button.secondary{background:#eef0f6;color:#303746}button.danger{background:var(--danger)}button.success{background:var(--success)}button:disabled{opacity:.5;cursor:not-allowed;transform:none}
input[type=file]{display:none}input,select{width:100%;padding:10px 12px;border:1px solid #dfe3ec;border-radius:9px;font:inherit}label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.table-wrap{max-height:330px;overflow:auto;border:1px solid #edf0f5;border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:14px}th{background:#f8f9fc;position:sticky;top:0;z-index:1}td input{padding:6px 8px}.empty{text-align:center;color:var(--muted);padding:30px}
.lottery{grid-column:1/-1;text-align:center;padding:28px}.prize-select{max-width:500px;margin:0 auto 16px}.draw-buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.draw{font-size:20px;padding:15px 30px;border-radius:14px}.reset{background:#fff;color:var(--danger);border:2px solid var(--danger)}
.winner-area{min-height:140px;margin-top:20px;padding:20px;border-radius:15px;background:linear-gradient(135deg,#fff9e6,#fff);border:2px dashed #ffd166}
.winner-title{font-size:18px;color:#8a6200}.winner-name{font-size:34px;font-weight:900;color:#5f4bd8;margin:10px 0}.winner-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:15px}.winner-chip{padding:12px;background:#fff;border-radius:10px;box-shadow:0 3px 12px #0001;font-weight:700}
.status{font-size:13px;color:var(--muted);margin-top:8px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}.stat{background:#f7f7fb;border-radius:10px;padding:10px 14px}.stat b{font-size:20px;display:block;color:var(--primary)}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
@media(max-width:800px){.grid{grid-template-columns:1fr}.lottery{grid-column:auto}header h1{font-size:28px}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<header><h1>🎉 幸運大抽獎</h1><p>Excel 名單匯入・獎項管理・一次抽完・中獎名單下載</p></header>

<div class="container">
  <div class="grid">
    <section class="card">
      <h2>👥 參加者名單</h2>
      <div class="toolbar">
        <label class="file-label">📥 匯入 Excel / CSV<input id="participantFile" type="file" accept=".xlsx,.xls,.csv"></label>
        <button class="secondary" onclick="addParticipant()">＋新增</button>
        <button class="secondary" onclick="removeDuplicates()">🧹 移除重複</button>
        <button class="danger" onclick="clearParticipants()">清空</button>
      </div>
      <div class="stats"><div class="stat"><b id="participantCount">0</b>參加者</div><div class="stat"><b id="availableCount">0</b>可抽獎</div></div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>姓名／參加者</th><th>操作</th></tr></thead><tbody id="participantBody"></tbody></table></div>
      <div class="status">Excel 第一欄會自動作為參加者名稱；第一列可為標題。</div>
    </section>

    <section class="card">
      <h2>🏆 獎項管理</h2>
      <div class="toolbar">
        <label class="file-label">📥 匯入獎項 Excel<input id="prizeFile" type="file" accept=".xlsx,.xls,.csv"></label>
        <button class="secondary" onclick="addPrize()">＋新增獎項</button>
        <button class="danger" onclick="clearPrizes()">清空</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>獎項名稱</th><th>名額</th><th>操作</th></tr></thead><tbody id="prizeBody"></tbody></table></div>
      <div class="status">Excel：第一欄為獎項名稱，第二欄為名額；沒有名額時預設 1 名。</div>
    </section>

    <section class="card lottery">
      <h2>🎰 抽獎區</h2>
      <div class="prize-select">
        <label>選擇抽獎方式</label>
        <select id="prizeSelect" onchange="updateDrawInfo()"></select><div id="drawInfo" class="status" style="margin-top:8px">請先建立獎項</div>
      </div>
      <div class="draw-buttons">
        <button class="draw" onclick="drawSelected()">🎯 抽選此獎項</button>
        <button class="draw success" onclick="drawAll()">🏆 全部獎項一次抽完</button>
        <button class="draw reset" onclick="resetLottery()">↻ 重置抽獎</button>
      </div>
      <div class="winner-area">
        <div class="winner-title" id="winnerTitle">尚未開始抽獎</div>
        <div class="winner-name" id="winnerName">祝你好運！</div>
        <div class="winner-list" id="winnerList"></div>
      </div>
    </section>

    <section class="card" style="grid-column:1/-1">
      <h2>📋 中獎名單</h2>
      <div class="toolbar">
        <button onclick="downloadWinners('xlsx')">⬇️ 下載 Excel</button>
        <button class="secondary" onclick="downloadWinners('csv')">⬇️ 下載 CSV</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>獎項</th><th>中獎者</th></tr></thead><tbody id="winnerTableBody"></tbody></table></div>
    </section>
  </div>
</div>

<script>
let participants=[];
let prizes=[];
let winners=[];
let drawing=false;

const $=id=>document.getElementById(id);

function renderParticipants(){
  $("participantBody").innerHTML=participants.length?participants.map((p,i)=>`<tr><td>${i+1}</td><td><input value="${esc(p)}" onchange="participants[${i}]=this.value.trim();save()"></td><td><button class="danger" onclick="participants.splice(${i},1);renderParticipants();save()">刪除</button></td></tr>`).join(""):`<tr><td colspan="3" class="empty">尚無參加者</td></tr>`;
  $("participantCount").textContent=participants.length;
  updateAvailable();
}
function renderPrizes(){
  const old=$('prizeSelect').value;
  $('prizeBody').innerHTML=prizes.length?prizes.map((p,i)=>{
    const won=winners.filter(w=>w.prize===p.name).length;
    return `<tr><td>${i+1}</td><td><input value="${esc(p.name)}" onchange="updatePrizeName(${i},this.value)"></td><td><input type="number" min="1" value="${p.count}" onchange="updatePrizeCount(${i},this.value)"></td><td><span class="status">已中 ${won} / ${p.count}</span> <button class="danger" onclick="prizes.splice(${i},1);renderPrizes();save()">刪除</button></td></tr>`
  }).join(''):`<tr><td colspan="4" class="empty">尚無獎項</td></tr>`;
  $('prizeSelect').innerHTML=prizes.map((p,i)=>{const won=winners.filter(w=>w.prize===p.name).length;return `<option value="${i}">${esc(p.name)}｜總名額 ${p.count} 名｜剩餘 ${Math.max(0,p.count-won)} 名</option>`}).join('');
  if(prizes[old]) $('prizeSelect').value=old;
  updateDrawInfo();
}
function updatePrizeName(i,v){const old=prizes[i].name,n=v.trim()||'未命名獎項';if(old!==n)winners.forEach(w=>{if(w.prize===old)w.prize=n});prizes[i].name=n;renderPrizes();renderWinners();save()}
function updatePrizeCount(i,v){const won=winners.filter(w=>w.prize===prizes[i].name).length,n=Math.max(1,parseInt(v)||1);if(n<won){alert(`此獎項目前已中獎 ${won} 名，名額不能低於已中獎人數。`);renderPrizes();return}prizes[i].count=n;renderPrizes();save()}
function updateDrawInfo(){const i=parseInt($('prizeSelect').value),el=$('drawInfo');if(!el)return;if(!prizes[i]){el.textContent='請先建立獎項';return}const p=prizes[i],won=winners.filter(w=>w.prize===p.name).length;el.textContent=`${p.name}｜設定 ${p.count} 名｜已中 ${won} 名｜本次將抽 ${Math.max(0,p.count-won)} 名`}

function renderWinners(){
  $("winnerTableBody").innerHTML=winners.length?winners.map(w=>`<tr><td>${esc(w.prize)}</td><td>${esc(w.name)}</td></tr>`).join(""):`<tr><td colspan="2" class="empty">尚無中獎紀錄</td></tr>`;
}
function addParticipant(){participants.push("新參加者");renderParticipants();save()}
function addPrize(){prizes.push({name:"新獎項",count:1});renderPrizes();save()}
function clearParticipants(){if(confirm("確定清空全部參加者？")){participants=[];renderParticipants();save()}}
function clearPrizes(){if(confirm("確定清空全部獎項？")){prizes=[];renderPrizes();save()}}
function removeDuplicates(){
  const before=participants.length;
  const seen=new Set();
  participants=participants.filter(x=>{const k=x.trim().toLowerCase();if(!k||seen.has(k))return false;seen.add(k);return true});
  renderParticipants();save();
  alert(`已移除 ${before-participants.length} 筆重複或空白名單。`);
}
function updateAvailable(){
  const won=new Set(winners.map(w=>w.name));
  $("availableCount").textContent=participants.filter(x=>x && !won.has(x)).length;
}
function resetLottery(){
  if(confirm("重置後將清除全部中獎紀錄，參加者可重新抽獎。確定嗎？")){
    winners=[];renderWinners();renderPrizes();updateAvailable();$("winnerTitle").textContent="尚未開始抽獎";$("winnerName").textContent="祝你好運！";$("winnerList").innerHTML="";save();
  }
}
function availableNames(){
  const won=new Set(winners.map(w=>w.name));
  return participants.filter(x=>x && !won.has(x));
}
async function drawSelected(){
  if(drawing)return;
  const i=parseInt($("prizeSelect").value);
  if(!prizes[i])return alert("請先建立獎項。");
  await drawPrize(i);
}
async function drawAll(){
  if(drawing)return;
  if(!prizes.length)return alert("請先建立獎項。");
  if(!availableNames().length)return alert("沒有可抽獎的參加者。");
  for(let i=0;i<prizes.length;i++){
    if(availableNames().length===0)break;
    await drawPrize(i);
    await sleep(500);
  }
}
async function drawPrize(i){
 const prize=prizes[i]; if(!prize)return;
 const won=winners.filter(w=>w.prize===prize.name).length, need=Math.max(0,prize.count-won);
 if(!need){$('winnerTitle').textContent=`${prize.name} 已完成抽獎`;$('winnerName').textContent='此獎項名額已全部抽完';$('winnerList').innerHTML='';updateDrawInfo();return}
 const pool=availableNames();if(!pool.length)return;const actual=Math.min(need,pool.length);drawing=true;
 $('winnerTitle').textContent=`🎉 ${prize.name} 抽獎中…`;$('winnerList').innerHTML='';
 for(let t=0;t<22;t++){$('winnerName').textContent=pool[Math.floor(Math.random()*pool.length)];await sleep(55+t*10)}
 const selected=shuffle(pool).slice(0,actual);selected.forEach(name=>winners.push({prize:prize.name,name}));
 $('winnerTitle').textContent=`🎊 ${prize.name} 中獎名單`;$('winnerName').textContent=selected.length===1?selected[0]:`共 ${selected.length} 位中獎`;$('winnerList').innerHTML=selected.map(n=>`<div class="winner-chip">🏆 ${esc(n)}</div>`).join('');
 renderPrizes();renderWinners();updateAvailable();updateDrawInfo();save();launchConfetti(260);drawing=false;
}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

async function importExcel(file,type){
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  if(!rows.length)return;
  if(type==="participants"){
    const values=rows.flat().map(x=>String(x).trim()).filter(Boolean);
    participants=values;
    if(participants.length>1 && /姓名|名稱|name|參加者/i.test(participants[0]))participants.shift();
    removeDuplicates();
  }else{
    let start=0;
    if(rows[0] && /獎項|名稱|prize/i.test(String(rows[0][0])))start=1;
    prizes=rows.slice(start).filter(r=>String(r[0]).trim()).map(r=>({name:String(r[0]).trim(),count:Math.max(1,parseInt(r[1])||1)}));
    renderPrizes();save();
  }
}
$("participantFile").addEventListener("change",e=>{if(e.target.files[0])importExcel(e.target.files[0],"participants");e.target.value=""});
$("prizeFile").addEventListener("change",e=>{if(e.target.files[0])importExcel(e.target.files[0],"prizes");e.target.value=""});

function save(){localStorage.setItem("lotteryData",JSON.stringify({participants,prizes,winners}))}
function load(){try{const d=JSON.parse(localStorage.getItem("lotteryData")||"{}");participants=d.participants||[];prizes=d.prizes||[];winners=d.winners||[]}catch(e){}}
function downloadWinners(type){
  if(!winners.length)return alert("目前沒有中獎名單。");
  const rows=[["獎項","中獎者"],...winners.map(w=>[w.prize,w.name])];
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"中獎名單");
  XLSX.writeFile(wb,`中獎名單_${new Date().toISOString().slice(0,10)}.${type==="csv"?"csv":"xlsx"}`);
}

const canvas=$("confetti"),ctx=canvas.getContext("2d");let pieces=[],raf;
function launchConfetti(n=180){
  canvas.width=innerWidth;canvas.height=innerHeight;
  pieces=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*180,y:innerHeight*.28,dx:(Math.random()-.5)*12,dy:Math.random()*-12-4,g:0.35,s:Math.random()*7+4,r:Math.random()*Math.PI,c:Math.random()*360,life:Math.random()*100+100}));
  cancelAnimationFrame(raf);animateConfetti();
}
function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  pieces.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.dy+=p.g;p.r+=.1;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=`hsl(${p.c},90%,60%)`;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.8);ctx.restore()});
  pieces=pieces.filter(p=>p.life>0&&p.y<canvas.height+30);
  if(pieces.length)raf=requestAnimationFrame(animateConfetti);else ctx.clearRect(0,0,canvas.width,canvas.height);
}
addEventListener("resize",()=>{canvas.width=innerWidth;canvas.height=innerHeight});

load();renderParticipants();renderPrizes();renderWinners();updateAvailable();
</script>
</body>
</html>
